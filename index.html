<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>4색 정리 세계지도 챌린지</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://unpkg.com/topojson-client@3"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.85);
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
      --ocean: #091322;
      --land-default: #1e293b;
      --land-stroke: #475569;
      --accent: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
      touch-action: manipulation;
    }

    /* 상단 헤더 */
    header {
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }

    .title-area h1 { font-size: 1.15rem; font-weight: 700; color: #fff; }
    .title-area p { font-size: 0.8rem; color: var(--text-sub); }

    .stats {
      display: flex;
      gap: 16px;
      font-size: 0.85rem;
    }
    .stat-item {
      background: rgba(0, 0, 0, 0.25);
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .stat-item span { font-weight: bold; color: var(--accent); }

    /* 지도 영역 */
    #map-container {
      flex: 1;
      position: relative;
      background-color: var(--ocean);
      overflow: hidden;
      cursor: grab;
    }
    #map-container:active { cursor: grabbing; }

    svg { width: 100%; height: 100%; display: block; }

    path.country {
      stroke: var(--land-stroke);
      stroke-width: 0.6px;
      transition: fill 0.15s ease, stroke 0.15s ease;
      cursor: pointer;
    }
    path.country:hover {
      filter: brightness(1.25);
      stroke: #fff;
      stroke-width: 1.2px;
    }

    /* 충돌 애니메이션 */
    @keyframes pulse-conflict {
      0% { stroke: #ef4444; stroke-width: 2px; }
      50% { stroke: #ffffff; stroke-width: 3.5px; }
      100% { stroke: #ef4444; stroke-width: 2px; }
    }
    path.country.conflict {
      animation: pulse-conflict 1s infinite;
    }

    /* 하단 팔레트 및 컨트롤러 */
    .controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--card-bg);
      padding: 10px 18px;
      border-radius: 40px;
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 20;
    }

    .palette { display: flex; gap: 8px; }
    .color-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 3px solid transparent;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }
    .color-btn:hover { transform: scale(1.1); }
    .color-btn.selected {
      transform: scale(1.18);
      border-color: #fff;
      box-shadow: 0 0 12px rgba(255,255,255,0.4);
    }

    .btn {
      background: #334155;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      font-size: 0.8rem;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn:hover { background: #475569; }

    /* 알림창 */
    #status-toast {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      pointer-events: none;
      transition: opacity 0.3s;
      opacity: 0;
      z-index: 30;
      font-weight: 600;
    }

    /* 줌 버튼 */
    .zoom-btns {
      position: absolute;
      right: 20px;
      bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 20;
    }
    .zoom-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: #fff;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .zoom-btn:hover { background: #334155; }
  </style>
</head>
<body>

  <header>
    <div class="title-area">
      <h1>🗺️ 4색 정리 세계지도 챌린지</h1>
      <p>단 4가지 색상만 써서 이웃한 국가끼리 겹치지 않게 칠해보세요!</p>
    </div>
    <div class="stats">
      <div class="stat-item">칠한 국가: <span id="colored-count">0</span> / <span id="total-count">0</span></div>
      <div class="stat-item">충돌: <span id="conflict-count" style="color: #4ade80;">0</span></div>
    </div>
  </header>

  <div id="map-container">
    <svg id="map"></svg>
    <div id="status-toast"></div>
    <div class="zoom-btns">
      <button class="zoom-btn" id="zoom-in">+</button>
      <button class="zoom-btn" id="zoom-out">−</button>
      <button class="zoom-btn" id="zoom-reset" style="font-size: 0.8rem;">초기화</button>
    </div>
  </div>

  <div class="controls">
    <div class="palette" id="palette"></div>
    <div style="width: 1px; height: 24px; background: var(--border); margin: 0 4px;"></div>
    <button class="btn" id="btn-eraser">지우개</button>
    <button class="btn" id="btn-reset">초기화</button>
  </div>

  <script>
    // 4색 테마 색상 (시각적으로 선명하고 구분이 잘 되는 4색)
    const COLORS = ["#38bdf8", "#4ade80", "#fbbf24", "#f43f5e"];
    let currentColor = COLORS[0];
    let isEraser = false;

    // 상태 저장 변수
    const countryColors = {};     // id -> color
    const adjacencyGraph = {};    // id -> Set(neighborId)
    const countryNames = {};      // id -> Name
    let totalCountries = 0;

    const svg = d3.select("#map");
    const g = svg.append("g");
    const toast = document.getElementById("status-toast");

    // 줌 동작 설정
    const zoom = d3.zoom()
      .scaleExtent([1, 14])
      .on("zoom", (event) => g.attr("transform", event.transform));
    svg.call(zoom);

    // 팔레트 동적 렌더링
    const paletteDiv = document.getElementById("palette");
    COLORS.forEach((col, idx) => {
      const btn = document.createElement("button");
      btn.className = `color-btn ${idx === 0 ? "selected" : ""}`;
      btn.style.backgroundColor = col;
      btn.onclick = () => {
        isEraser = false;
        currentColor = col;
        document.querySelectorAll(".color-btn").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
        document.getElementById("btn-eraser").style.background = "#334155";
      };
      paletteDiv.appendChild(btn);
    });

    // 지우개 버튼
    document.getElementById("btn-eraser").onclick = function() {
      isEraser = true;
      document.querySelectorAll(".color-btn").forEach(b => b.classList.remove("selected"));
      this.style.background = "#e11d48";
    };

    // 전체 리셋 버튼
    document.getElementById("btn-reset").onclick = () => {
      if (confirm("모든 색칠을 초기화할까요?")) {
        for (let k in countryColors) delete countryColors[k];
        d3.selectAll("path.country")
          .attr("fill", "var(--land-default)")
          .classed("conflict", false);
        checkValidity();
        showToast("초기화되었습니다.");
      }
    };

    // 지도 데이터 로드 (world-atlas 110m)
    d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(world => {
      const width = window.innerWidth;
      const height = window.innerHeight - 60;
      svg.attr("viewBox", `0 0 ${width} ${height}`);

      const projection = d3.geoNaturalEarth1()
        .scale(width / 6.2)
        .translate([width / 2, height / 2]);
      const path = d3.geoPath().projection(projection);

      // 남극 대륙 제외 및 유효한 국가 피처 필터링
      const countries = topojson.feature(world, world.objects.countries).features.filter(d => d.id !== "010");
      totalCountries = countries.length;
      document.getElementById("total-count").innerText = totalCountries;

      // ★ [핵심 버그 수정] 인접 그래프 구축 (Self-loop 및 중복 완벽 제거)
      const rawNeighbors = topojson.neighbors(world.objects.countries.geometries);

      countries.forEach((feature, idx) => {
        const id = String(feature.id);
        if (!adjacencyGraph[id]) adjacencyGraph[id] = new Set();
        
        // neighbors 리스트 탐색
        if (rawNeighbors[idx]) {
          rawNeighbors[idx].forEach(neighborIdx => {
            const neighborFeature = countries[neighborIdx];
            if (neighborFeature) {
              const neighborId = String(neighborFeature.id);
              // ★ 자기 자신(같은 ID)은 절대 이웃으로 등록하지 않음!
              if (neighborId !== id) {
                adjacencyGraph[id].add(neighborId);
              }
            }
          });
        }
      });

      // 국가 지도 그리기
      g.selectAll("path.country")
        .data(countries)
        .enter()
        .append("path")
        .attr("class", "country")
        .attr("d", path)
        .attr("fill", "var(--land-default)")
        .on("click", function(event, d) {
          const id = String(d.id);
          if (isEraser) {
            delete countryColors[id];
            d3.select(this).attr("fill", "var(--land-default)");
          } else {
            countryColors[id] = currentColor;
            d3.select(this).attr("fill", currentColor);
          }
          checkValidity(id);
        });

      // 리사이즈 처리
      window.addEventListener("resize", () => {
        const w = window.innerWidth, h = window.innerHeight - 60;
        svg.attr("viewBox", `0 0 ${w} ${h}`);
        projection.scale(w / 6.2).translate([w / 2, h / 2]);
        g.selectAll("path.country").attr("d", path);
      });
    });

    // ★ [핵심 버그 수정] 인접 충돌 검사 알고리즘
    function checkValidity(touchedId = null) {
      const conflictSet = new Set();
      let coloredCount = 0;

      // 색이 칠해진 모든 국가에 대해 충돌 검사
      for (const [id, color] of Object.entries(countryColors)) {
        if (!color) continue;
        coloredCount++;

        const neighbors = adjacencyGraph[id];
        if (neighbors) {
          neighbors.forEach(nId => {
            // ★ 자기 자신이 아니면서(보호장치 2중 적용) 색이 동일한 경우만 충돌!
            if (nId !== id && countryColors[nId] && countryColors[nId] === color) {
              conflictSet.add(id);
              conflictSet.add(nId);
            }
          });
        }
      }

      // 화면 스타일 반영
      d3.selectAll("path.country")
        .classed("conflict", d => conflictSet.has(String(d.id)));

      // 통계 UI 갱신
      document.getElementById("colored-count").innerText = coloredCount;
      const conflictEl = document.getElementById("conflict-count");
      conflictEl.innerText = conflictSet.size;
      conflictEl.style.color = conflictSet.size > 0 ? "#ef4444" : "#4ade80";

      // 알림 메시지
      if (touchedId && conflictSet.has(touchedId)) {
        showToast("⚠️ 인접한 국가와 색이 같습니다! (국경 충돌)", "#ef4444");
      } else if (coloredCount === totalCountries && conflictSet.size === 0) {
        showToast("🎉 축하합니다! 4색 정리를 완벽하게 증명했습니다!", "#4ade80");
      }
    }

    function showToast(text, color = "#fff") {
      toast.innerText = text;
      toast.style.color = color;
      toast.style.opacity = 1;
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => toast.style.opacity = 0, 2200);
    }

    // 줌 컨트롤 버튼 핸들러
    document.getElementById("zoom-in").onclick = () => svg.transition().call(zoom.scaleBy, 1.4);
    document.getElementById("zoom-out").onclick = () => svg.transition().call(zoom.scaleBy, 0.7);
    document.getElementById("zoom-reset").onclick = () => svg.transition().call(zoom.transform, d3.zoomIdentity);
  </script>
</body>
</html>
